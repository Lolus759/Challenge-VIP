<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement Général - Challenge VIP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        h1 { font-size: 24px; margin-bottom: 20px; color: #f8fafc; font-weight: 600; text-align: center; }
        
        /* Boutons de filtres (Jour / Semaine / Mois) */
        .filtres-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(30, 41, 59, 0.5);
            padding: 6px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-filtre {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-filtre.actif {
            background: #f97316;
            color: #fff;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        .classement-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .classement-item {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 600;
        }
        .classement-item span:first-child { color: #f97316; display: flex; align-items: center; gap: 8px; }
        .badge-points { color: #4ade80; font-size: 16px; font-weight: 700; }
        
        .btn-retour {
            background: #f97316;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }
        .btn-retour:hover { background: #ea580c; transform: scale(1.02); }
    </style>
</head>
<body>

    <h1>Classement Général</h1>

    <!-- Onglets de sélection en direct -->
    <div class="filtres-container">
        <button class="btn-filtre actif" onclick="changerFiltre('jour', this)">Jour</button>
        <button class="btn-filtre" onclick="changerFiltre('semaine', this)">Semaine</button>
        <button class="btn-filtre" onclick="changerFiltre('mois', this)">Mois</button>
    </div>

    <div class="classement-container" id="liste-classement">
        <!-- Dynamique -->
    </div>

    <a href="dashboard_principal.html" class="btn-retour">
        <i class="fas fa-arrow-left"></i> Retour au tableau de bord
    </a>

    <script>
        let filtreActuel = 'jour';

        function masquerNumero(phone) {
            if (!phone) return "Joueur VIP";
            let cleanPhone = phone.replace(/\s+/g, '').replace(/[^0-9+]/g, '');
            if (cleanPhone.length < 4) return "Joueur VIP";

            let premier = cleanPhone.slice(0, 2);
            let derniers = cleanPhone.slice(-2);
            let nbMasque = Math.max(3, cleanPhone.length - 4);
            let milieuMasque = "●".repeat(nbMasque);

            return `${premier}${milieuMasque}${derniers}`;
        }

        // Vérification et réinitialisation automatique selon les règles de temps
        function verifierReinitialisations() {
            let maintenant = new Date();
            let dateJour = maintenant.toDateString();
            
            let debutAnnee = new Date(maintenant.getFullYear(), 0, 1);
            let numSemaine = Math.ceil((((maintenant - debutAnnee) / 86400000) + debutAnnee.getDay() + 1) / 7);
            let cleSemaine = `${maintenant.getFullYear()}-S${numSemaine}`;
            let cleMois = `${maintenant.getFullYear()}-${maintenant.getMonth()}`;

            let dernierJour = localStorage.getItem('vip_dernier_jour');
            let derniereSemaine = localStorage.getItem('vip_derniere_semaine');
            let dernierMois = localStorage.getItem('vip_dernier_mois');

            if (dernierJour !== dateJour) {
                localStorage.setItem('vip_dernier_jour', dateJour);
            }
            if (derniereSemaine !== cleSemaine) {
                localStorage.setItem('vip_derniere_semaine', cleSemaine);
            }
            if (dernierMois !== cleMois) {
                localStorage.setItem('vip_dernier_mois', cleMois);
            }
        }

        function changerFiltre(type, btn) {
            filtreActuel = type;
            document.querySelectorAll('.btn-filtre').forEach(b => b.classList.remove('actif'));
            btn.classList.add('actif');
            chargerClassement();
        }

        function chargerClassement() {
            verifierReinitialisations();

            let classementKey = `challenge_vip_classement_${filtreActuel}`;
            let classement = JSON.parse(localStorage.getItem(classementKey)) || [];

            // Nettoyage des éléments indésirables
            classement = classement.filter(j => !j.id.includes('#7589') && !j.id.includes('4821'));

            const phone = localStorage.getItem('vip_user_phone');
            
            if (phone) {
                let idMasque = masquerNumero(phone);
                
                // Récupération des points réels du profil actuel
                const userKey = 'vip_data_' + phone.replace(/\s+/g, '');
                let userData = JSON.parse(localStorage.getItem(userKey));
                let pointsExacts = userData ? (userData.points || 0) : (parseInt(localStorage.getItem('vip_points_total')) || 0);

                let index = classement.findIndex(j => j.id.includes(masquerNumero(phone)));
                
                if (index !== -1) {
                    classement[index].points = pointsExacts;
                } else if (pointsExacts > 0) {
                    classement.push({ id: idMasque, points: pointsExacts });
                }
            }

            // Tri par ordre décroissant des points
            classement.sort((a, b) => b.points - a.points);
            localStorage.setItem(classementKey, JSON.stringify(classement));

            const conteneur = document.getElementById('liste-classement');
            conteneur.innerHTML = '';

            if (classement.length === 0) {
                conteneur.innerHTML = `<div class="classement-item" style="justify-content: center; color: #94a3b8;">Aucun joueur classé pour cette période</div>`;
                return;
            }

            classement.forEach((joueur, index) => {
                let div = document.createElement('div');
                div.className = 'classement-item';
                
                let iconeMedaille = `<span style="color: #94a3b8;">#${index + 1}</span>`;
                if (index === 0) iconeMedaille = '<i class="fas fa-medal" style="color: #facc15; font-size: 18px;"></i>';
                else if (index === 1) iconeMedaille = '<i class="fas fa-medal" style="color: #94a3b8; font-size: 18px;"></i>';
                else if (index === 2) iconeMedaille = '<i class="fas fa-medal" style="color: #d97706; font-size: 18px;"></i>';

                div.innerHTML = `<span>${iconeMedaille} &nbsp; ${joueur.id}</span> <span class="badge-points">${joueur.points} Pts</span>`;
                conteneur.appendChild(div);
            });
        }

        chargerClassement();
    </script>
</body>
</html>
